<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich menu</title>
    <link rel="stylesheet" href="sandwich.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="menu">
            <div class="wrapper">
                <div class="menu__inner">
                    <h1 class="menu__title">
                        Our Best & Delicious Menu
                    </h1>
                    <nav class="menu__nav">
                        <a href="../index.html" class="menu__link">
                            All
                        </a>
                        <a href="burger.html" class="menu__link">
                            Burger
                        </a>
                        <a href="#" class="menu__link">
                            Taco
                        </a>
                        <a href="kebab.html" class="menu__link">

                        </a>
                        <a href="#" class="menu__link menu__link-active">
                            Sandwich
                        </a>
                    </nav>
                </div>
            </div>
        </section>
        <section class="dish">
            <div class="wrapper">
                <div class="dish__inner">
                    <div class="dish__blocks">
                        <div class="dish__block">
                            <img class="dish__img" src="img/sandwich.png" alt="">

                                Sandwich
                            </h4>
                            <p class="dish__desc">
                                Lorem Ipsum is simply dummy text of the printing and typesetting industry.
                            </p>
                            <div class="dish__price-div">
                                <p class="dish__price">

                                </p>

                            </div>
                        </div>
                    </div>
                    <a href="../index.html" class="dish__btn">
                        See All
                    </a>
                </div>
            </div>
        </section>

</html>
